# Elevator HMI — kas workspace manifest (Phase 0)
# All external layers are pinned to full SHAs (no floating branches).
# Ref names below are documentation only; BitBake uses `commit` exclusively.
#
# Pinned references (as of manifest creation, 2026-04-15):
#   poky                 yocto-5.0.16  (Scarthgap / Yocto 5.0 LTS)
#   meta-openembedded    refs/heads/scarthgap  (required by meta-rockchip; not optional)
#   meta-rockchip        refs/heads/scarthgap
#   meta-qt6             refs/heads/6.8.3      (PUBLIC open-source Qt 6.8.3 — see note below)
#   meta-rauc            refs/heads/scarthgap

header:
  version: 21

machine: elevator-hmi-em3566
distro: elevator-hmi
target: core-image-minimal

local_conf_header:
  distro: |
    DISTRO = "elevator-hmi"

  diskspace: |
    # 2026-08-07: this build host is disk-constrained and the Qt 6.8 image
    # (qtbase + qtdeclarative + qtmultimedia + gstreamer) is far larger than
    # core-image-minimal. rm_work deletes each recipe's WORKDIR once that recipe
    # finishes, which cuts PEAK tmp/ usage dramatically at the cost of losing
    # per-recipe build trees for debugging.
    INHERIT += "rm_work"
    # Keep the kernel WORKDIR: we routinely inspect the patched jadard driver
    # source and the resulting .config to verify panel patches and kernel
    # options (e.g. CONFIG_FRAMEBUFFER_CONSOLE). work-shared/kernel-source is
    # already exempt from rm_work, but the kernel WORKDIR holding .config is not.
    # Keep GPU/Qt workdirs too: this is the first ever build of the EGLFS stack,
    # and diagnosing a libmali or qtbase EGL/GBM failure without its WORKDIR
    # (config logs, meson/cmake output) is painful.
    RM_WORK_EXCLUDE += "linux-rockchip rockchip-libmali qtbase"
    # Abort cleanly instead of corrupting TMPDIR if the disk fills mid-build.
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},2G,100K \
        STOPTASKS,${DL_DIR},2G,100K \
        ABORT,${TMPDIR},1G,10K \
        ABORT,${DL_DIR},1G,10K"

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    commit: 1d54d1c4736a114e1cecbe85a0306e3814d5ce70
    layers:
      meta:
        prio: 99
      meta-poky:
        prio: 98
      meta-yocto-bsp:
        prio: 97

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    commit: 5124ac4a658899158f4a7a2ddf1d2ca931ec7d0e
    layers:
      meta-oe:
        prio: 90
      meta-python:
        prio: 89

  meta-rockchip:
    url: https://github.com/JeffyCN/meta-rockchip
    commit: 5218d6330f5c49724650e63902e569c909df0889
    layers:
      .:
        prio: 85

  # 2026-08-17: re-pinned from lts-6.8.6 (443684a0) to the PUBLIC 6.8.3 branch.
  #
  # WHY: every meta-qt6 `lts-*` branch fetches Qt modules from The Qt Company's
  # COMMERCIAL repositories (git://codereview.qt-project.org/qt/tqtc-<module>.git),
  # which require a Qt commercial license and authenticated access. The first
  # build of elevator-hmi-image failed at do_fetch on tqtc-qtbase,
  # tqtc-qtdeclarative, tqtc-qtshadertools, tqtc-qtlanguageserver and
  # tqtc-qtquicktimeline. Qt LTS point releases are a commercial-only benefit;
  # open source gets the public 6.8.x branches from code.qt.io.
  #
  # ⚠ LICENSING FOLLOW-UP REQUIRED BEFORE PRODUCTION (owner decision 2026-08-17,
  # taken deliberately with this caveat): public Qt is LGPLv3, which carries the
  # anti-tivoization / "installation information" requirement — end users must be
  # able to relink the application against a modified Qt on the device. That
  # interacts directly with this product's SIGNED RAUC OTA and locked-down field
  # units (24/7 unattended, 5-year field life, 500–1000 units/yr). This needs
  # legal review, and may still end in purchasing a commercial license.
  # This deviates from ADR-001 ("Qt 6.8 LTS") — see CLAUDE.md §3.
  meta-qt6:
    url: https://code.qt.io/yocto/meta-qt6
    commit: 00c3bd954341a2a755fdee6b978af952f51793e7
    layers:
      .:
        prio: 80

  meta-rauc:
    url: https://github.com/rauc/meta-rauc
    commit: d63878f20eba7a85ecf53566e7a3377e78bb46ac
    layers:
      .:
        prio: 75

  meta-hmi-platform:
    # Paths are relative to KAS_WORK_DIR (repo root when you `kas build` from there)
    path: meta-hmi-platform
    layers:
      .:
        prio: 70

  meta-hmi-app:
    path: meta-hmi-app
    layers:
      .:
        prio: 65
