# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
# Single-directory image recipes (TASK-108 bundle stub)
BBFILES += "${LAYERDIR}/recipes-images/*.bb ${LAYERDIR}/recipes-images/*.bbappend"

BBFILE_COLLECTIONS += "hmi-app"
BBFILE_PATTERN_hmi-app := "^${LAYERDIR}/"
BBFILE_PRIORITY_hmi-app = "9"

LAYERDEPENDS_hmi-app = "core qt6-layer rauc"
LAYERVERSION_hmi-app = "1"
LAYERSERIES_COMPAT_hmi-app = "scarthgap"

# CLAUDE.md §8 (Qt/QML): "All QML files in src/qml/, mirrored in meta-hmi-app
# recipe". The canonical UI sources therefore live in the repo's top-level
# src/qml/ — editable and reviewable outside the Yocto layer — and the app
# recipe adds this to FILESEXTRAPATHS rather than duplicating them under
# recipes-qt/.../files/. Same pattern as ELEVATOR_HMI_EMMC_WKS in
# meta-hmi-platform/conf/layer.conf.
ELEVATOR_HMI_QML_DIR = "${LAYERDIR}/../src/qml"
