# Elevator HMI — DRM fbdev emulation (panel / bring-up smoke tests)
# FB core must be enabled: DRM_FBDEV_EMULATION depends on FB=y (drivers/gpu/drm/Kconfig).
CONFIG_FB=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_FBDEV_OVERALLOC=100

# 2026-08-07: framebuffer console. Until now the defconfig had
# "# CONFIG_FRAMEBUFFER_CONSOLE is not set", so /dev/fb0 existed but NOTHING ever
# rendered into it -- a zero-filled framebuffer is a correctly-displayed BLACK
# screen. This was the reason the panel appeared dead after the real bug (DSI
# command-vs-video init ordering, patch 0021) had already been fixed: a manual
# `dd` of white to /dev/fb0 lit the glass fully white, proving the whole path
# works. Enabling fbcon makes the console render on the panel so the display
# shows content by itself, with no manual framebuffer writes.
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y

# Boot logo: immediate, unambiguous visual confirmation that the panel is live,
# very early in boot (before userspace). Cheap and useful during bring-up.
CONFIG_LOGO=y
CONFIG_LOGO_LINUX_CLUT224=y
