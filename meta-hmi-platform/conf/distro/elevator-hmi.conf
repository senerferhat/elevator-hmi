# Elevator HMI — project distro configuration
# Inherits poky distro as base.
require conf/distro/poky.conf

DISTRO = "elevator-hmi"
DISTRO_NAME = "Elevator HMI"
DISTRO_VERSION = "0.1"

# RAUC OTA update support (meta-rauc)
DISTRO_FEATURES:append = " rauc"

# No X11, no Wayland — single application EGLFS HMI.
# `vulkan` also removed (2026-08-07): poky's POKY_DEFAULT_DISTRO_FEATURES enables
# it, which makes qtbase build with -DFEATURE_vulkan=ON and RDEPEND on
# vulkan-loader. rockchip-libmali ships only a libMaliVulkan wrapper with no ICD
# manifest, so that loader could never find a driver on this SoC — it is pure
# build time, image size and runtime dead weight for a Qt Quick 2D HMI.
# Keeping `opengl` is required: qtbase gates its "kms gbm gles2 eglfs"
# PACKAGECONFIG on it (meta-qt6/recipes-qt/qt6/qtbase_git.bb).
DISTRO_FEATURES:remove = "x11 wayland vulkan"

# Development images: empty root password + useful post-install debug hooks (Poky `debug-tweaks`).
# Remove or override for production signing / hardening workflows.
EXTRA_IMAGE_FEATURES += "debug-tweaks"

