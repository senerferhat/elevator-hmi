#@TYPE: Machine
#@NAME: Elevator HMI — Boardcon EM3566 v3 reference (RK3566 + LMT101 on DSI0)
#
# Inherits RK3566 EVB2 LP4X V10 machine tuning from meta-rockchip (Wi‑Fi, U-Boot,
# tune files). Overrides only the kernel DTB to the project Boardcon bring-up DTS
# (TASK-104). Do not edit meta-rockchip — this file lives in meta-hmi-platform.
#
# U-Boot / eMMC (TASK-102): inherits `UBOOT_MACHINE = "rk3568_defconfig"` and
# Rockchip loader packaging from `rockchip-rk3566-evb`. On-chip storage is
# eMMC (mmcblk0). Flash with vendor `rkdeveloptool` / `upgrade_tool` or WIC
# image per `meta-hmi-platform/wic/elevator-hmi-emmc.wks.in` + BSP docs.

require conf/machine/rockchip-rk3566-evb.conf

KERNEL_DEVICETREE = "rockchip/elevator-hmi-boardcon-em3566-v3.dtb"
KERNEL_IMAGETYPE = "Image"
# uboot-extlinux-config.bbclass generates ${B}/extlinux.conf for the U-Boot
# build task (do_create_extlinux_config). ROOT, CONSOLE, FDT are required here.
# NOTE: the WIC bootimg-partition plugin ignores these variables and regenerates
# extlinux.conf independently; it is controlled by WKS bootloader --configfile
# (see meta-hmi-platform/wic/elevator-hmi-emmc.wks.in + elevator-hmi-extlinux.conf).
UBOOT_EXTLINUX = "1"
UBOOT_EXTLINUX_FDT = "/elevator-hmi-boardcon-em3566-v3.dtb"
UBOOT_EXTLINUX_CONSOLE = "console=ttyS2,1500000"
UBOOT_EXTLINUX_ROOT = "root=/dev/mmcblk0p2 rw rootfstype=ext4 rootwait"

# bootimg-partition WIC plugin reads IMAGE_BOOT_FILES to populate the vfat /boot
# partition. meta-rockchip does not set this variable. Deploy dir produces both
# files flat (Yocto kernel recipe strips the arch/arm64/boot/ prefix on deploy).
IMAGE_BOOT_FILES = "Image elevator-hmi-boardcon-em3566-v3.dtb"

# ---------------------------------------------------------------------------
# GPU userspace (Mali-G52 / Bifrost) — Qt 6.8 EGLFS
# ---------------------------------------------------------------------------
# These are ALREADY set, weakly (?=), by meta-rockchip:
#   conf/machine/include/rk356x.inc -> conf/machine/include/mali.inc
# and machine conf is parsed before distro conf, so rockchip-libmali already
# wins over poky's default-providers.inc (mesa). We restate them with a HARD
# assignment so the choice is (a) visible in our own layer rather than buried
# in an inherited include, and (b) stable if meta-rockchip is ever bumped or
# reorganised. Same values as mali.inc — this changes nothing today.
#
# NOTE: rockchip-libmali is a PROPRIETARY Arm binary (LICENSE = "CLOSED").
# It is the only provider of virtual/egl-libgles2-libgbm for this SoC in
# meta-rockchip; mesa has no Bifrost support. Shipping it is a deliberate
# product decision, not an accident of inheritance.
PREFERRED_PROVIDER_virtual/egl = "rockchip-libmali"
PREFERRED_PROVIDER_virtual/libgles1 = "rockchip-libmali"
PREFERRED_PROVIDER_virtual/libgles2 = "rockchip-libmali"
PREFERRED_PROVIDER_virtual/libgles3 = "rockchip-libmali"
PREFERRED_PROVIDER_virtual/libgbm = "rockchip-libmali"

# libmali ships one blob per window system. mali.inc derives this from
# DISTRO_FEATURES (wayland -> x11 -> gbm fallback); with x11/wayland removed it
# lands on "gbm", which is what EGLFS/KMS requires. Pin it so that re-adding
# x11 or wayland to DISTRO_FEATURES later cannot silently swap the blob variant
# and break EGLFS. Selected blob: libmali-bifrost-g52-g13p0-gbm.so
MALI_PLATFORM = "gbm"
